<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sell122 • Instagram</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0f12;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 90px;
    height: 100vh;
    border-right: 1px solid #25282b;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 35px;
    gap: 30px;
}

.sidebar svg {
    width: 32px;
    height: 32px;
    stroke: #f5f5f5;
    stroke-width: 2;
    fill: none;
}

.sidebar .logo {
    margin-bottom: 25px;
}

/* ================= CONTENT ================= */

.content {
    margin-left: 90px;
    width: calc(100% - 90px);
    min-height: 100vh;
}

.profile {
    width: 1170px;
    max-width: calc(100% - 80px);
    margin: auto;
    padding-top: 25px;
}

/* ================= PROFILE TOP ================= */

.profile-header {
    display: flex;
    align-items: flex-start;
    gap: 45px;
}

.avatar {
    width: 225px;
    height: 225px;
    border-radius: 50%;
    overflow: hidden;
    background: #1c2024;
    flex-shrink: 0;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Kalau belum ada foto */
.avatar.empty {
    background: #1c2024;
}

.profile-info {
    padding-top: 52px;
    flex: 1;
}

.username-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.username {
    font-size: 32px;
    font-weight: 700;
}

.more {
    font-size: 25px;
    color: #ddd;
}

.stats {
    display: flex;
    gap: 28px;
    margin-top: 30px;
    font-size: 20px;
}

.stats span {
    white-space: nowrap;
}

.bio {
    margin-top: 32px;
    font-size: 18px;
}

/* ================= FOLLOW BUTTON ================= */

.follow-button {
    width: 100%;
    height: 66px;
    margin-top: 38px;
    border: none;
    border-radius: 18px;
    background: #4c5df5;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.follow-button:hover {
    background: #4051e8;
}

.follow-button:active {
    transform: scale(.99);
}

/* ================= PRIVATE AREA ================= */

.divider {
    height: 1px;
    background: #292d30;
    margin-top: 66px;
}

.private {
    text-align: center;
    padding-top: 36px;
}

.lock {
    width: 74px;
    height: 74px;
    border: 1.5px solid #f1f1f1;
    border-radius: 50%;
    margin: auto;

    display: flex;
    justify-content: center;
    align-items: center;
}

.lock-icon {
    width: 27px;
    height: 25px;
    border: 2px solid #eee;
    border-radius: 5px;
    position: relative;
    margin-top: 8px;
}

.lock-icon::before {
    content: "";
    position: absolute;
    width: 15px;
    height: 15px;
    border: 2px solid #eee;
    border-bottom: none;
    border-radius: 12px 12px 0 0;

    left: 50%;
    top: -13px;
    transform: translateX(-50%);
}

.private-title {
    margin-top: -61px;
    margin-left: 170px;
    text-align: left;
    font-size: 20px;
    font-weight: 700;
}

.private-description {
    margin-top: 10px;
    margin-left: 170px;
    text-align: left;
    color: #a8a8a8;
    font-size: 18px;
}

/* ================= SUGGESTED ================= */

.suggested {
    margin-top: 45px;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: bold;
}

.see-all {
    color: #6070ff;
}

/* ================= MOBILE ================= */

@media (max-width: 800px) {

    .sidebar {
        width: 65px;
        gap: 25px;
    }

    .sidebar svg {
        width: 27px;
        height: 27px;
    }

    .content {
        margin-left: 65px;
        width: calc(100% - 65px);
    }

    .profile {
        max-width: calc(100% - 30px);
    }

    .profile-header {
        gap: 20px;
    }

    .avatar {
        width: 130px;
        height: 130px;
    }

    .profile-info {
        padding-top: 15px;
    }

    .username {
        font-size: 23px;
    }

    .stats {
        font-size: 15px;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 18px;
    }

    .bio {
        font-size: 15px;
        margin-top: 18px;
    }

    .follow-button {
        height: 55px;
        font-size: 17px;
    }

    .private-title,
    .private-description {
        margin-left: 0;
        text-align: center;
    }

    .private-title {
        margin-top: 15px;
    }

    .private-description {
        margin-top: 8px;
        font-size: 15px;
    }
}

@media (max-width: 500px) {

    .sidebar {
        display: none;
    }

    .content {
        margin-left: 0;
        width: 100%;
    }

    .profile {
        max-width: calc(100% - 30px);
        padding-top: 20px;
    }

    .profile-header {
        gap: 15px;
    }

    .avatar {
        width: 90px;
        height: 90px;
    }

    .profile-info {
        padding-top: 5px;
    }

    .username {
        font-size: 20px;
    }

    .stats {
        font-size: 13px;
        gap: 8px;
        margin-top: 12px;
    }

    .bio {
        position: absolute;
        left: 15px;
        margin-top: 125px;
    }

    .follow-button {
        margin-top: 75px;
    }

    .divider {
        margin-top: 45px;
    }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <!-- Instagram -->
    <div class="logo">
        <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
    </div>

    <!-- Home -->
    <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-6v-7H10v7H4a1 1 0 0 1-1-1z"></path>
    </svg>

    <!-- Reels -->
    <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <polygon points="10,8 16,12 10,16"></polygon>
    </svg>

    <!-- DM -->
    <svg viewBox="0 0 24 24">
        <path d="M3 4l18 7-18 9 4-7z"></path>
    </svg>

    <!-- Search -->
    <svg viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5"></circle>
        <path d="M16 16l5 5"></path>
    </svg>

    <!-- Notifications -->
    <svg viewBox="0 0 24 24">
        <path d="M20 17H4l2-3V9a6 6 0 0 1 12 0v5z"></path>
        <path d="M9 20h6"></path>
    </svg>

    <!-- Create -->
    <svg viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"></path>
    </svg>

</aside>


<!-- ================= MAIN ================= -->

<main class="content">

    <div class="profile">

        <!-- PROFILE HEADER -->

        <section class="profile-header">

            <!--
            ======================================
            FOTO PROFIL

            Nanti ganti menjadi:

            <div class="avatar">
                <img src="URL-FOTO-KAMU.jpg">
            </div>
            ======================================
            -->

            <div class="avatar empty"></div>


            <div class="profile-info">

                <div class="username-row">
                    <h1 class="username">sell122</h1>
                    <span class="more">•••</span>
                </div>

                <div class="stats">
                    <span>0 posts</span>
                    <span><b>49</b> followers</span>
                    <span><b>196</b> following</span>
                </div>

                <div class="bio">
                    cowok kurus 🤏
                </div>

            </div>

        </section>


        <!-- FOLLOW -->

        <button class="follow-button" onclick="followAccount()">
            Follow
        </button>


        <!-- DIVIDER -->

        <div class="divider"></div>


        <!-- PRIVATE PROFILE -->

        <section class="private">

            <div class="lock">
                <div class="lock-icon"></div>
            </div>

            <h2 class="private-title">
                This profile is private
            </h2>

            <p class="private-description">
                Follow to see their photos and videos.
            </p>

        </section>


        <!-- SUGGESTED -->

        <section class="suggested">
            <span>Suggested for you</span>
            <span class="see-all">See all</span>
        </section>

    </div>

</main>


<script>

function followAccount() {
    const button = document.querySelector(".follow-button");

    if (button.innerText === "Follow") {
        button.innerText = "Following";
        button.style.background = "#26292d";
    } else {
        button.innerText = "Follow";
        button.style.background = "#4c5df5";
    }
}

</script>

</body>
</html>
